name: OQuaRE Ontology Quality Evaluation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  oquare-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Run OQuaRE Metrics
        uses: tecnomod-um/oquare-metrics@v3.0
        with:
          ontology-folders: ontologies
          reasoner: ELK
          contents-folder: OQuaRE
          model-plot: 'true'
          feature-plot: 'true'
          subfeature-plot: 'true'
          metrics-plots: 'true'
          evolution-plot: 'true'
